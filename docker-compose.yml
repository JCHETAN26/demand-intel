services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demand_intel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demand_intel}
      POSTGRES_DB: ${POSTGRES_DB:-demand_intel}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  mlflow:
    build: ./infrastructure/mlflow
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["5000:5000"]
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER:-demand_intel}:${POSTGRES_PASSWORD:-demand_intel}@postgres:5432/mlflow
      --artifacts-destination /mlartifacts
      --serve-artifacts
    volumes:
      - mlartifacts:/mlartifacts

  airflow:
    profiles: ["airflow"]
    build:
      context: .
      dockerfile: orchestration/airflow/Dockerfile
    command: standalone
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/demand-intel/orchestration/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-demand_intel}:${POSTGRES_PASSWORD:-demand_intel}@postgres:5432/${POSTGRES_DB:-demand_intel}
      DI_MLFLOW_TRACKING_URI: http://mlflow:5000
    ports: ["8080:8080"]
    volumes:
      - ./data:/opt/demand-intel/data
      - ./evaluation:/opt/demand-intel/evaluation
    depends_on: [postgres, mlflow]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DI_SERVING_DIR: /srv/serving
    ports: ["8000:8000"]
    volumes:
      - ./data/serving:/srv/serving:ro

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    depends_on: [api]

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
  mlartifacts:
