[project]
name = "demand-intel"
version = "0.1.0"
description = "Multimodal demand forecasting and inventory decision platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pandera>=0.20",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.optional-dependencies]
# Installed incrementally as phases need them: `uv sync --extra ml`, etc.
ml = [
    "scikit-learn>=1.5",
    "statsforecast>=1.7",
    "lightgbm>=4.3",
    "optuna>=3.6",
    "mlflow>=2.14",
    "shap>=0.45",
    "scipy>=1.13",
]
deep = ["torch>=2.3", "lightning>=2.3", "pytorch-forecasting>=1.0"]
nlp = [
    "transformers>=4.44",
    "datasets>=2.20",
    "peft>=0.12",
    "accelerate>=0.33",
    "bitsandbytes>=0.43",
    "sentence-transformers>=3.0",
    "optimum[onnxruntime]>=1.21",
    "datasketch>=1.6",
]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "prometheus-client>=0.20"]
monitoring = ["evidently>=0.4"]
versioning = ["dvc[s3]>=3.50"]
# Airflow pins most of its dependency tree, so it runs from its own image
# (orchestration/airflow) rather than as an extra of this package.

[project.scripts]
demand-intel = "demand_intel.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demand_intel"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "PTH", "RUF", "PD", "NPY"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["demand_intel"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "lightgbm.*", "statsforecast.*", "shap.*", "mlflow.*", "optuna.*",
    "pytorch_forecasting.*", "peft.*", "datasketch.*", "evidently.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires docker services (postgres, mlflow)",
    "data: requires raw datasets in data/raw",
    "gpu: requires a CUDA device",
]
