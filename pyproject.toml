[project]
name = "demand-intel"
version = "0.1.0"
description = "Multimodal demand forecasting and inventory decision platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pandera>=0.20",
    "pyyaml>=6",
    "typer>=0.12",
    "kaggle>=2.0",
    "httpx>=0.27",
    "tabulate>=0.9",
    "scipy>=1.13",
]

[project.optional-dependencies]
# Installed incrementally as phases need them: `uv sync --extra ml`, etc.
ml = [
    "scikit-learn>=1.5",
    "statsforecast>=1.7",
    "lightgbm>=4.3",
    "optuna>=3.6",
    "mlflow>=2.14",
    "shap>=0.45",
    "scipy>=1.13",
]
deep = ["torch>=2.3"]  # LSTM and TFT are implemented in plain PyTorch
nlp = [
    "transformers>=4.44",
    "datasets>=2.20",
    "peft>=0.12",
    "accelerate>=0.33",
    "bitsandbytes>=0.43",
    "sentence-transformers>=3.0",
    "optimum[onnxruntime]>=1.21",
    "datasketch>=1.6",
]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "prometheus-client>=0.20", "httpx>=0.27", "boto3>=1.34"]
monitoring = ["evidently>=0.4"]
versioning = ["dvc[s3]>=3.50"]
# Airflow pins most of its dependency tree, so it runs from its own image
# (orchestration/airflow) rather than as an extra of this package.

[tool.uv.sources]
# CPU wheels: Codespaces/CI have no GPU. On a CUDA machine, install torch from the CUDA index.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
demand-intel = "demand_intel.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demand_intel"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "PTH", "RUF", "PD", "NPY"]
ignore = ["PD010"]  # unstack() is clearer than pivot_table for grouped results
allowed-confusables = ["×", "–", "—", "−", "≤", "≥", "σ", "ρ"]

[tool.ruff.lint.per-file-ignores]
# long regex alternations read better unwrapped
"src/demand_intel/models/nlp/labeling.py" = ["E501"]
# evidence sentences are long f-strings; wrapping them hurts more than it helps
"src/demand_intel/acceptance.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["demand_intel"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "lightgbm.*", "statsforecast.*", "shap.*", "mlflow.*", "optuna.*",
    "pytorch_forecasting.*", "peft.*", "datasketch.*", "evidently.*", "pandera.*", "tabulate.*", "scipy.*", "sklearn.*", "transformers.*",
    "sentence_transformers.*", "boto3.*", "onnxruntime.*", "torch.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# torch's nn.Module.__call__ and autograd are untyped; keep the rest of strict mode.
module = ["demand_intel.models.deep_learning.*", "demand_intel.models.nlp.*"]
disable_error_code = ["no-any-return", "no-untyped-call"]
# torch is an optional extra; without it nn.Module resolves to Any.
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires docker services (postgres, mlflow)",
    "data: requires raw datasets in data/raw",
    "gpu: requires a CUDA device",
]
